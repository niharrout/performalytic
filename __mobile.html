<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#080e1c;overflow:hidden}
  iframe{border:0;display:block}
</style></head>
<body>
<iframe id="f"></iframe>
<script>
(function(){
  var p = new URLSearchParams(location.search);
  var t = p.get('target');
  var w = parseInt(p.get('w') || '390', 10);
  var h = parseInt(p.get('h') || '900', 10);
  var off = parseInt(p.get('off') || '0', 10);
  var f = document.getElementById('f');
  f.style.width = w + 'px';
  f.style.height = h + 'px';
  f.addEventListener('load', function(){
    function go(){
      var d = f.contentDocument;
      d.documentElement.style.scrollBehavior = 'auto';
      d.body.style.scrollBehavior = 'auto';
      var y = off > 10000 ? (d.body.scrollHeight - h) : off;
      var sel = p.get('sel');
      if (sel) {
        var el = d.querySelector(sel);
        if (el) y = el.getBoundingClientRect().top + (d.documentElement.scrollTop || d.body.scrollTop) - 16;
      }
      f.contentWindow.scrollTo(0, Math.max(0, y));
    }
    go(); setTimeout(go, 200); setTimeout(go, 900);
    if (p.get('hide') === 'cookie') {
      setTimeout(function(){
        var all = f.contentDocument.querySelectorAll('body *');
        for (var i = 0; i < all.length; i++) {
          var el = all[i];
          var cs = f.contentWindow.getComputedStyle(el);
          if (cs.position !== 'fixed') continue;
          if ((el.textContent || '').indexOf('We use cookies') !== -1) el.remove();
        }
      }, 700);
    }
    setTimeout(function(){
      document.title = 'OK y=' + Math.round(f.contentWindow.pageYOffset) +
        ' sw=' + f.contentDocument.documentElement.scrollWidth +
        ' cw=' + f.contentDocument.documentElement.clientWidth;
    }, 1400);
  });
  f.src = t;
})();
</script>
</body></html>
