<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="adTitle">
<title id="adTitle">Agentic database DevOps — an agent plans from live context, a deterministic gate decides, and a named human approves before the pipeline executes</title>
<defs>
<linearGradient id="adBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1120"/><stop offset="1" stop-color="#1b2540"/></linearGradient>
<linearGradient id="adBrand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
<linearGradient id="adCyl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#132038"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
<radialGradient id="adGb"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.2"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
<radialGradient id="adGr"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.14"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
<pattern id="adGrid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#94a3b8" stroke-opacity="0.06"/></pattern>
<marker id="adArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#7c3aed"/></marker>
<marker id="adArrow2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#34d399"/></marker>
</defs>
<rect width="1200" height="600" fill="url(#adBg)"/>
<rect width="1200" height="600" fill="url(#adGrid)"/>
<ellipse cx="380" cy="280" rx="420" ry="330" fill="url(#adGb)"/>
<ellipse cx="980" cy="480" rx="340" ry="260" fill="url(#adGr)"/>
<g font-family="Segoe UI, system-ui, sans-serif">

<!-- loop arcs -->
<path d="M482 146 Q566 152 574 234" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#adArrow)"/>
<path d="M614 322 Q618 452 494 456" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#adArrow)"/>
<path d="M278 456 Q196 452 192 322" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#adArrow)"/>
<path d="M148 242 Q144 156 274 146" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#adArrow)"/>

<!-- centre : the database -->
<g>
<rect x="322" y="216" width="116" height="128" rx="10" fill="url(#adCyl)" stroke="#60a5fa" stroke-opacity="0.6"/>
<ellipse cx="380" cy="216" rx="58" ry="20" fill="#16233d" stroke="#60a5fa" stroke-opacity="0.7"/>
<ellipse cx="380" cy="344" rx="58" ry="20" fill="#0f172a" stroke="#60a5fa" stroke-opacity="0.4"/>
<text x="380" y="286" text-anchor="middle" font-size="12" letter-spacing="3" fill="#94a3b8">PROD</text>
<text x="380" y="308" text-anchor="middle" font-size="14" font-weight="800" fill="#60a5fa">DATABASE</text>
</g>

<!-- loop node : goal -->
<rect x="280" y="72" width="200" height="76" rx="14" fill="#111a30" stroke="#60a5fa" stroke-opacity="0.6"/>
<text x="380" y="104" text-anchor="middle" font-size="11" letter-spacing="3" fill="#60a5fa">STEP 1</text>
<text x="380" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">Goal and scope</text>

<!-- loop node : context -->
<rect x="512" y="242" width="200" height="76" rx="14" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.6"/>
<text x="612" y="274" text-anchor="middle" font-size="11" letter-spacing="3" fill="#a78bfa">STEP 2</text>
<text x="612" y="298" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">Live context</text>

<!-- loop node : plan -->
<rect x="280" y="418" width="200" height="76" rx="14" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.6"/>
<text x="380" y="450" text-anchor="middle" font-size="11" letter-spacing="3" fill="#22d3ee">STEP 3</text>
<text x="380" y="474" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">Reviewable plan</text>

<!-- loop node : verify -->
<rect x="50" y="242" width="200" height="76" rx="14" fill="#111a30" stroke="#34d399" stroke-opacity="0.6"/>
<text x="150" y="274" text-anchor="middle" font-size="11" letter-spacing="3" fill="#34d399">STEP 4</text>
<text x="150" y="298" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">Deterministic gate</text>

<text x="380" y="546" text-anchor="middle" font-size="11" letter-spacing="4" fill="#64748b">PERCEIVE &#183; REASON &#183; ACT &#183; CHECK &#8212; UNTIL THE GOAL IS MET</text>

<!-- right panel -->
<rect x="744" y="50" width="412" height="510" rx="20" fill="#0f172a" stroke="url(#adBrand)" stroke-width="2"/>
<text x="776" y="94" font-size="13" letter-spacing="5" fill="#64748b">AGENTIC DATABASE DEVOPS</text>
<text x="776" y="126" font-size="19" font-weight="800" fill="#e2e8f0">Nothing runs unsupervised</text>

<rect x="776" y="152" width="348" height="86" rx="14" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.55"/>
<text x="798" y="182" font-size="12" letter-spacing="3" fill="#a78bfa">THE PLAN IS A DIFF</text>
<text x="798" y="208" font-size="14" font-weight="700" fill="#e2e8f0">Sequenced actions with reasoning</text>
<text x="798" y="228" font-size="12" fill="#94a3b8">every step reviewable before execution</text>

<rect x="776" y="252" width="348" height="86" rx="14" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.55"/>
<text x="798" y="282" font-size="12" letter-spacing="3" fill="#22d3ee">THE GATE IS CODE</text>
<text x="798" y="308" font-size="14" font-weight="700" fill="#e2e8f0">Deterministic checks decide</text>
<text x="798" y="328" font-size="12" fill="#94a3b8">tests, policy and blast radius &#8212; no judgement call</text>

<rect x="776" y="352" width="348" height="86" rx="14" fill="#111a30" stroke="#34d399" stroke-opacity="0.6"/>
<text x="798" y="382" font-size="12" letter-spacing="3" fill="#34d399">THE APPROVAL IS HUMAN</text>
<text x="798" y="408" font-size="14" font-weight="700" fill="#e2e8f0">Named approver, risk-proportional</text>
<text x="798" y="428" font-size="12" fill="#94a3b8">who signed off is recorded, not implied</text>

<path d="M776 470 L1124 470" stroke="#2b3a5c"/>
<text x="776" y="504" font-size="12" letter-spacing="3" fill="#64748b">THEN THE PIPELINE RUNS</text>
<text x="776" y="530" font-size="13" font-weight="700" fill="#94a3b8">Deploy &#183; verify &#183; write back to memory</text>
</g>
</svg>
