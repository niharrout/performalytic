<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="mdmTitle mdmDesc">
<title id="mdmTitle">Master Data Management in the AI era</title>
<desc id="mdmDesc">Source systems on the left feed an MDM hub that creates one golden record, which powers AI models, customer and product 360 views, and BI analytics on the right</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1120"/><stop offset="1" stop-color="#111C33"/></linearGradient>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
<radialGradient id="glowBlue"><stop offset="0" stop-color="#2563EB" stop-opacity="0.28"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
<radialGradient id="glowAmber"><stop offset="0" stop-color="#F59E0B" stop-opacity="0.14"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient>
<radialGradient id="glowGreen"><stop offset="0" stop-color="#34D399" stop-opacity="0.14"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity="0.05"/></pattern>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000814" flood-opacity="0.45"/></filter>
</defs>
<rect width="1200" height="600" fill="url(#bg)"/>
<rect width="1200" height="600" fill="url(#grid)"/>
<ellipse cx="600" cy="300" rx="340" ry="300" fill="url(#glowBlue)"/>
<ellipse cx="240" cy="140" rx="300" ry="200" fill="url(#glowAmber)"/>
<ellipse cx="980" cy="470" rx="300" ry="200" fill="url(#glowGreen)"/>

<g font-family="Inter, Segoe UI, system-ui, sans-serif">
