<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="16" fill="#0f1d35"/>

  <!-- Circuit traces -->
  <g opacity="0.5">
    <path d="M20,50 H70 V90 H90" fill="none" stroke="rgba(96,165,250,0.3)" stroke-width="1.5"/>
    <path d="M180,60 H150 V110 H130" fill="none" stroke="rgba(96,165,250,0.3)" stroke-width="1.5"/>
    <path d="M40,180 V150 H70 V130" fill="none" stroke="rgba(124,58,237,0.3)" stroke-width="1.5"/>
    <path d="M180,165 H130 V140 H115" fill="none" stroke="rgba(124,58,237,0.3)" stroke-width="1.5"/>
    <circle cx="20" cy="50" r="2.5" fill="rgba(96,165,250,0.5)"/>
    <circle cx="180" cy="60" r="2.5" fill="rgba(96,165,250,0.5)"/>
    <circle cx="40" cy="180" r="2.5" fill="rgba(124,58,237,0.5)"/>
    <circle cx="180" cy="165" r="2.5" fill="rgba(124,58,237,0.5)"/>
  </g>

  <!-- CPU chip -->
  <g>
    <rect x="70" y="70" width="60" height="60" rx="8" fill="#1e293b" stroke="url(#techGrad)" stroke-width="2"/>
    <rect x="82" y="82" width="36" height="36" rx="4" fill="rgba(37,99,235,0.12)" stroke="rgba(96,165,250,0.25)" stroke-width="1"/>
    <text x="100" y="104" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="9" font-weight="700">&lt;/&gt;</text>
    <!-- Pins -->
    <g stroke="rgba(96,165,250,0.4)" stroke-width="1.5">
      <line x1="85" y1="70" x2="85" y2="62"/>
      <line x1="100" y1="70" x2="100" y2="62"/>
      <line x1="115" y1="70" x2="115" y2="62"/>
      <line x1="85" y1="138" x2="85" y2="146"/>
      <line x1="100" y1="138" x2="100" y2="146"/>
      <line x1="115" y1="138" x2="115" y2="146"/>
      <line x1="70" y1="85" x2="62" y2="85"/>
      <line x1="70" y1="100" x2="62" y2="100"/>
      <line x1="70" y1="115" x2="62" y2="115"/>
      <line x1="138" y1="85" x2="146" y2="85"/>
      <line x1="138" y1="100" x2="146" y2="100"/>
      <line x1="138" y1="115" x2="146" y2="115"/>
    </g>
  </g>

  <!-- Code lines -->
  <g opacity="0.6">
    <rect x="30" y="115" width="22" height="4" rx="2" fill="rgba(74,222,128,0.4)"/>
    <rect x="30" y="124" width="16" height="4" rx="2" fill="rgba(96,165,250,0.4)"/>
    <rect x="152" y="75" width="18" height="4" rx="2" fill="rgba(167,139,250,0.4)"/>
    <rect x="152" y="84" width="24" height="4" rx="2" fill="rgba(96,165,250,0.4)"/>
  </g>

  <!-- Data nodes -->
  <g>
    <circle cx="152" cy="128" r="5" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="152" cy="128" r="1.5" fill="#60a5fa"/>
    <path d="M48,120 Q80,150 130,140" fill="none" stroke="rgba(124,58,237,0.4)" stroke-width="1.5" stroke-dasharray="4,3">
      <animate attributeName="stroke-dashoffset" values="0;14" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>