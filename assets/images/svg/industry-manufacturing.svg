<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <g transform="translate(0,-60) scale(1.6)">
  <defs>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="16" fill="#0f1d35"/>
  
  <!-- Factory building -->
  <rect x="40" y="90" width="120" height="80" rx="4" fill="#1e293b" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <!-- Smokestacks -->
  <rect x="55" y="55" width="16" height="35" rx="2" fill="#1e293b" stroke="rgba(96,165,250,0.3)" stroke-width="1"/>
  <rect x="80" y="65" width="16" height="25" rx="2" fill="#1e293b" stroke="rgba(96,165,250,0.3)" stroke-width="1"/>
  
  <!-- Smoke puffs -->
  <circle cx="63" cy="45" r="8" fill="rgba(96,165,250,0.15)">
    <animate attributeName="cy" values="45;35;45" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.05;0.15" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="88" cy="55" r="6" fill="rgba(167,139,250,0.12)">
    <animate attributeName="cy" values="55;45;55" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.12;0.04;0.12" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Windows -->
  <rect x="52" y="105" width="14" height="14" rx="2" fill="rgba(96,165,250,0.2)"/>
  <rect x="74" y="105" width="14" height="14" rx="2" fill="rgba(96,165,250,0.2)"/>
  <rect x="96" y="105" width="14" height="14" rx="2" fill="rgba(96,165,250,0.15)"/>
  <rect x="118" y="105" width="14" height="14" rx="2" fill="rgba(96,165,250,0.2)"/>
  <rect x="52" y="130" width="14" height="14" rx="2" fill="rgba(96,165,250,0.15)"/>
  <rect x="74" y="130" width="14" height="14" rx="2" fill="rgba(96,165,250,0.2)"/>
  <rect x="96" y="130" width="14" height="14" rx="2" fill="rgba(96,165,250,0.12)"/>
  <rect x="118" y="130" width="14" height="14" rx="2" fill="rgba(96,165,250,0.15)"/>
  
  <!-- Door -->
  <rect x="88" y="148" width="24" height="22" rx="3" fill="rgba(37,99,235,0.3)"/>
  
  <!-- Gear icon -->
  <g transform="translate(155, 55)" opacity="0.6">
    <circle cx="0" cy="0" r="12" fill="none" stroke="url(#mGrad)" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="none" stroke="url(#mGrad)" stroke-width="1.5"/>
    <animateTransform attributeName="transform" type="rotate" from="0 155 55" to="360 155 55" dur="15s" repeatCount="indefinite"/>
  </g>
  
  <!-- Conveyor belt suggestion -->
  <line x1="30" y1="175" x2="170" y2="175" stroke="rgba(96,165,250,0.2)" stroke-width="2" stroke-dasharray="8,4"/>

  </g>
</svg>