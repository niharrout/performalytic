<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none" font-family="Inter, Arial, sans-serif">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="62%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.26"/>
      <stop offset="55%" style="stop-color:#7c3aed;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="numGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7dd3fc"/>
      <stop offset="100%" style="stop-color:#c4b5fd"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#60a5fa;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0b1526" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563eb" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="200" cy="130" r="160" fill="url(#bgGlow)">
    <animate attributeName="r" values="160;175;160" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.7">
    <circle cx="38" cy="66" r="3" fill="#38bdf8">
      <animate attributeName="cy" values="66;54;66" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="364" cy="92" r="3.5" fill="#a78bfa">
      <animate attributeName="cy" values="92;80;92" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="212" r="4" fill="#34d399" opacity="0.45">
      <animate attributeName="cy" values="212;200;212" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="150" r="2.5" fill="#60a5fa" opacity="0.6">
      <animate attributeName="cy" values="150;140;150" dur="4.4s" repeatCount="indefinite"/>
    </circle>
    <rect x="26" y="196" width="8" height="8" rx="2" fill="#38bdf8" opacity="0.4" transform="rotate(45 30 200)">
      <animate attributeName="y" values="196;186;196" dur="4.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="370" y="176" width="7" height="7" rx="1.5" fill="#a78bfa" opacity="0.4" transform="rotate(30 373 179)">
      <animate attributeName="y" values="176;166;176" dur="4.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="60" y="52" width="280" height="176" rx="16" fill="#0b1526" stroke="rgba(96,165,250,0.35)" stroke-width="1.5" filter="url(#cardShadow)"/>

  <rect x="62" y="54" width="2" height="172" fill="url(#scanGrad)">
    <animate attributeName="x" values="60;340" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <circle cx="78" cy="68" r="3" fill="#ef4444" opacity="0.8"/>
  <circle cx="88" cy="68" r="3" fill="#eab308" opacity="0.8"/>
  <circle cx="98" cy="68" r="3" fill="#22c55e" opacity="0.8"/>
  <text x="112" y="73" font-size="10.5" font-weight="600" fill="#e2e8f0">ROI Calculator</text>
  <rect x="300" y="58" width="32" height="18" rx="9" fill="rgba(52,211,153,0.12)" stroke="rgba(52,211,153,0.5)" stroke-width="1"/>
  <text x="316" y="70.5" text-anchor="middle" font-size="8.5" font-weight="600" fill="#4ade80">Free</text>

  <line x1="72" y1="88" x2="330" y2="88" stroke="rgba(148,163,184,0.18)" stroke-width="1"/>

  <text x="100" y="112" font-size="9" fill="#94a3b8">Projected Annual Savings</text>
  <text x="98" y="150" font-size="33" font-weight="800" fill="url(#numGrad)" filter="url(#glow)">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.3s" fill="freeze"/>$1.9M
  </text>
  <rect x="100" y="155" width="0" height="3" rx="1.5" fill="#34d399">
    <animate attributeName="width" from="0" to="132" dur="1.6s" begin="0.5s" fill="freeze"/>
  </rect>

  <text x="100" y="178" font-size="9" fill="#94a3b8">Payback period</text>
  <rect x="100" y="182" width="130" height="6" rx="3" fill="rgba(148,163,184,0.14)"/>
  <rect x="100" y="182" width="0" height="6" rx="3" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="104" dur="1.4s" begin="0.7s" fill="freeze"/>
  </rect>

  <text x="100" y="206" font-size="9" fill="#94a3b8">Time saved / year</text>
  <rect x="100" y="210" width="130" height="6" rx="3" fill="rgba(148,163,184,0.14)"/>
  <rect x="100" y="210" width="0" height="6" rx="3" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="92" dur="1.4s" begin="1s" fill="freeze"/>
  </rect>

  <text x="304" y="150" text-anchor="middle" font-size="12.5" font-weight="800" fill="url(#numGrad)" filter="url(#glow)">312% ROI</text>

  <g>
    <rect x="272" y="186" width="12" height="28" rx="4" fill="url(#barGrad)" opacity="0.7">
      <animate attributeName="height" values="28;38;28" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="186;176;186" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="289" y="174" width="12" height="40" rx="4" fill="url(#barGrad)" opacity="0.85">
      <animate attributeName="height" values="40;30;40" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="174;184;174" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="306" y="160" width="12" height="54" rx="4" fill="url(#barGrad)">
      <animate attributeName="height" values="54;44;54" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="160;170;160" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="323" y="184" width="12" height="30" rx="4" fill="url(#barGrad)" opacity="0.7">
      <animate attributeName="height" values="30;40;30" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="184;174;184" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="232" y="22" width="122" height="24" rx="12" fill="#0b1526" stroke="rgba(52,211,153,0.45)"/>
  <circle cx="246" cy="34" r="4" fill="#34d399" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="256" y="38" font-size="9.5" fill="#a7f3d0">Free &#124; No Signup</text>

  <rect x="50" y="234" width="104" height="24" rx="12" fill="#0b1526" stroke="rgba(56,189,248,0.45)"/>
  <circle cx="62" cy="246" r="3.5" fill="#38bdf8" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="74" y="249.5" font-size="9.5" fill="#bae6fd">Score 92/100</text>

  <rect x="246" y="234" width="104" height="24" rx="12" fill="#0b1526" stroke="rgba(167,139,250,0.45)"/>
  <circle cx="258" cy="246" r="3.5" fill="#a78bfa" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.25;1" dur="2s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <text x="270" y="249.5" font-size="9.5" fill="#d5c9f5">Save 320 hrs</text>
</svg>