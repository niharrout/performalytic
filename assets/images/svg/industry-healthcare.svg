<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <g transform="translate(0,-60) scale(1.6)">
  <defs>
    <linearGradient id="hGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="16" fill="#0f1d35"/>
  
  <!-- Heart with cross -->
  <g transform="translate(100, 85)">
    <path d="M0,20 C0,20 -25,0 -25,-12 C-25,-22 -15,-28 -5,-22 L0,-18 L5,-22 C15,-28 25,-22 25,-12 C25,0 0,20 0,20 Z" fill="rgba(5,150,105,0.15)" stroke="#4ade80" stroke-width="2"/>
    <!-- Medical cross -->
    <rect x="-3" y="-14" width="6" height="16" rx="1" fill="#4ade80" opacity="0.7"/>
    <rect x="-8" y="-9" width="16" height="6" rx="1" fill="#4ade80" opacity="0.7"/>
  </g>
  
  <!-- Heartbeat line -->
  <polyline points="20,140 45,140 55,120 65,155 75,130 85,145 95,140 110,140 120,125 130,150 140,135 155,140 180,140" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="400;0" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dasharray" values="0,400;400,0" dur="3s" repeatCount="indefinite"/>
  </polyline>
  
  <!-- Data nodes around heart -->
  <circle cx="40" cy="60" r="4" fill="rgba(96,165,250,0.3)">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="65" r="3" fill="rgba(167,139,250,0.3)">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="110" r="3" fill="rgba(74,222,128,0.3)">
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Connection lines to heart -->
  <line x1="40" y1="64" x2="78" y2="78" stroke="rgba(96,165,250,0.15)" stroke-width="1"/>
  <line x1="160" y1="68" x2="122" y2="78" stroke="rgba(167,139,250,0.15)" stroke-width="1"/>
  
  <!-- Bottom text bar -->
  <rect x="40" y="165" width="120" height="24" rx="12" fill="rgba(74,222,128,0.08)" stroke="rgba(74,222,128,0.15)" stroke-width="1"/>
  <text x="100" y="181" text-anchor="middle" fill="#4ade80" font-family="Inter,sans-serif" font-size="8" font-weight="600">PATIENT DATA SECURED</text>

  </g>
</svg>