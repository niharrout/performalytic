<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <g transform="translate(0,-60) scale(1.6)">
  <rect width="200" height="200" rx="16" fill="#0f1d35"/>
  
  <!-- Bank building -->
  <polygon points="100,35 160,70 40,70" fill="rgba(96,165,250,0.15)" stroke="#60a5fa" stroke-width="1.5"/>
  
  <!-- Pillars -->
  <rect x="52" y="70" width="8" height="70" rx="2" fill="rgba(96,165,250,0.12)" stroke="rgba(96,165,250,0.25)" stroke-width="1"/>
  <rect x="76" y="70" width="8" height="70" rx="2" fill="rgba(96,165,250,0.12)" stroke="rgba(96,165,250,0.25)" stroke-width="1"/>
  <rect x="100" y="70" width="8" height="70" rx="2" fill="rgba(96,165,250,0.12)" stroke="rgba(96,165,250,0.25)" stroke-width="1"/>
  <rect x="124" y="70" width="8" height="70" rx="2" fill="rgba(96,165,250,0.12)" stroke="rgba(96,165,250,0.25)" stroke-width="1"/>
  
  <!-- Base -->
  <rect x="40" y="140" width="120" height="12" rx="2" fill="rgba(96,165,250,0.1)" stroke="rgba(96,165,250,0.2)" stroke-width="1"/>
  
  <!-- Shield icon on building -->
  <g transform="translate(100, 95)">
    <path d="M0,-12 L10,-6 L10,4 C10,10 0,16 0,16 C0,16-10,10-10,4 L-10,-6 Z" fill="rgba(37,99,235,0.2)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#60a5fa" font-family="Inter,sans-serif" font-size="10" font-weight="700">$</text>
  </g>
  
  <!-- Coins -->
  <circle cx="155" cy="155" r="10" fill="rgba(234,179,8,0.15)" stroke="rgba(234,179,8,0.4)" stroke-width="1"/>
  <text x="155" y="159" text-anchor="middle" fill="rgba(234,179,8,0.6)" font-family="Inter,sans-serif" font-size="8" font-weight="700">$</text>
  <circle cx="168" cy="148" r="8" fill="rgba(234,179,8,0.1)" stroke="rgba(234,179,8,0.3)" stroke-width="1"/>
  
  <!-- Lock icon -->
  <g transform="translate(35, 155)">
    <rect x="-6" y="-2" width="12" height="10" rx="2" fill="rgba(74,222,128,0.15)" stroke="#4ade80" stroke-width="1"/>
    <path d="M-3,-2 L-3,-6 C-3,-10 3,-10 3,-6 L3,-2" fill="none" stroke="#4ade80" stroke-width="1.5"/>
  </g>

  </g>
</svg>