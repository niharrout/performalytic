<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <g transform="translate(0,-60) scale(1.6)">
  <defs>
    <linearGradient id="fGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="16" fill="#0f1d35"/>
  
  <!-- Chart bars -->
  <g>
    <rect x="30" y="120" width="18" height="45" rx="3" fill="rgba(37,99,235,0.4)">
      <animate attributeName="height" values="45;55;45" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="120;110;120" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="55" y="100" width="18" height="65" rx="3" fill="rgba(37,99,235,0.5)">
      <animate attributeName="height" values="65;50;65" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="100;115;100" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="80" y="80" width="18" height="85" rx="3" fill="rgba(37,99,235,0.6)">
      <animate attributeName="height" values="85;70;85" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="80;95;80" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="105" y="65" width="18" height="100" rx="3" fill="rgba(37,99,235,0.8)">
      <animate attributeName="height" values="100;85;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="65;80;65" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="130" y="55" width="18" height="110" rx="3" fill="url(#fGrad)">
      <animate attributeName="height" values="110;95;110" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="55;70;55" dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="155" y="70" width="18" height="95" rx="3" fill="rgba(124,58,237,0.7)">
      <animate attributeName="height" values="95;110;95" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="70;55;70" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Trend line -->
  <polyline points="39,115 64,95 89,75 114,60 139,50 164,65" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Dollar sign -->
  <text x="160" y="45" fill="#4ade80" font-family="Inter,sans-serif" font-size="20" font-weight="800" opacity="0.4">$</text>
  
  <!-- Axis line -->
  <line x1="25" y1="170" x2="180" y2="170" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  </g>
</svg>