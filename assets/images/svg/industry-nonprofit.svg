<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <g transform="translate(0,-60) scale(1.6)">
  <defs>
    <linearGradient id="nGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="16" fill="#0f1d35"/>
  
  <!-- Globe outline -->
  <circle cx="100" cy="90" r="45" fill="none" stroke="rgba(96,165,250,0.2)" stroke-width="1.5"/>
  <ellipse cx="100" cy="90" rx="20" ry="45" fill="none" stroke="rgba(96,165,250,0.12)" stroke-width="1"/>
  <line x1="55" y1="90" x2="145" y2="90" stroke="rgba(96,165,250,0.12)" stroke-width="1"/>
  <line x1="100" y1="45" x2="100" y2="135" stroke="rgba(96,165,250,0.12)" stroke-width="1"/>
  
  <!-- People figures around globe -->
  <g opacity="0.7">
    <!-- Person 1 -->
    <circle cx="60" cy="65" r="5" fill="rgba(74,222,128,0.3)"/>
    <line x1="60" y1="70" x2="60" y2="82" stroke="rgba(74,222,128,0.3)" stroke-width="2" stroke-linecap="round"/>
    <line x1="54" y1="75" x2="66" y2="75" stroke="rgba(74,222,128,0.3)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Person 2 -->
    <circle cx="140" cy="65" r="5" fill="rgba(96,165,250,0.3)"/>
    <line x1="140" y1="70" x2="140" y2="82" stroke="rgba(96,165,250,0.3)" stroke-width="2" stroke-linecap="round"/>
    <line x1="134" y1="75" x2="146" y2="75" stroke="rgba(96,165,250,0.3)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Person 3 -->
    <circle cx="100" cy="145" r="5" fill="rgba(167,139,250,0.3)"/>
    <line x1="100" y1="150" x2="100" y2="162" stroke="rgba(167,139,250,0.3)" stroke-width="2" stroke-linecap="round"/>
    <line x1="94" y1="155" x2="106" y2="155" stroke="rgba(167,139,250,0.3)" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Heart in center of globe -->
  <path d="M100,85 C100,85 88,75 88,68 C88,62 93,58 100,65 C107,58 112,62 112,68 C112,75 100,85 100,85 Z" fill="rgba(239,68,68,0.3)" stroke="#f87171" stroke-width="1.5"/>
  
  <!-- Connection arcs -->
  <path d="M60,68 Q80,50 100,65" fill="none" stroke="rgba(74,222,128,0.2)" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M140,68 Q120,50 100,65" fill="none" stroke="rgba(96,165,250,0.2)" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Impact text -->
  <rect x="55" y="172" width="90" height="18" rx="9" fill="rgba(74,222,128,0.08)" stroke="rgba(74,222,128,0.15)" stroke-width="1"/>
  <text x="100" y="184" text-anchor="middle" fill="#4ade80" font-family="Inter,sans-serif" font-size="7" font-weight="600">GLOBAL IMPACT</text>

  </g>
</svg>