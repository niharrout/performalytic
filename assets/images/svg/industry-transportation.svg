<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <g transform="translate(0,-60) scale(1.6)">
  <defs>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="16" fill="#0f1d35"/>
  
  <!-- Road -->
  <path d="M0,150 Q50,140 100,145 T200,140" fill="none" stroke="rgba(96,165,250,0.2)" stroke-width="20" stroke-linecap="round"/>
  <path d="M0,150 Q50,140 100,145 T200,140" fill="none" stroke="rgba(96,165,250,0.15)" stroke-width="2" stroke-dasharray="12,8"/>
  
  <!-- Truck body -->
  <g transform="translate(60, 115)">
    <rect x="0" y="0" width="60" height="30" rx="4" fill="#1e293b" stroke="rgba(96,165,250,0.3)" stroke-width="1"/>
    <rect x="60" y="8" width="25" height="22" rx="3" fill="#1e293b" stroke="rgba(96,165,250,0.3)" stroke-width="1"/>
    <rect x="65" y="12" width="15" height="10" rx="2" fill="rgba(96,165,250,0.15)"/>
    <!-- Wheels -->
    <circle cx="15" cy="32" r="6" fill="#1e293b" stroke="rgba(96,165,250,0.4)" stroke-width="1.5"/>
    <circle cx="15" cy="32" r="2" fill="rgba(96,165,250,0.3)"/>
    <circle cx="70" cy="32" r="6" fill="#1e293b" stroke="rgba(96,165,250,0.4)" stroke-width="1.5"/>
    <circle cx="70" cy="32" r="2" fill="rgba(96,165,250,0.3)"/>
  </g>
  
  <!-- Location pins -->
  <g transform="translate(30, 60)">
    <circle cx="0" cy="0" r="10" fill="rgba(37,99,235,0.2)" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#60a5fa"/>
    <path d="M0,10 L0,18" stroke="#60a5fa" stroke-width="1.5"/>
  </g>
  
  <g transform="translate(170, 70)">
    <circle cx="0" cy="0" r="8" fill="rgba(124,58,237,0.2)" stroke="#a78bfa" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2.5" fill="#a78bfa"/>
    <path d="M0,8 L0,14" stroke="#a78bfa" stroke-width="1.5"/>
  </g>
  
  <!-- Route line -->
  <path d="M30,68 Q100,30 170,70" fill="none" stroke="url(#tGrad)" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;14" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Data flow arrows -->
  <g opacity="0.4">
    <path d="M45,100 L55,95" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M55,95 L50,90" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  </g>
</svg>